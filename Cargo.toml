[package]
name = "notes-web"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["form"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
